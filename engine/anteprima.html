<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima regia</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --line:#2c2f35; --text:#e8e8ea; --muted:#9a9ca3; --acc:#e0b04a; --err:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .muted { color:var(--muted); }
  #err { display:none; white-space:pre-wrap; background:#2a1514; border:1px solid var(--err); color:#ffb3ae; padding:10px 12px; border-radius:6px; font-family:ui-monospace,monospace; font-size:13px; }
  canvas { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; display:block; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; min-height:36px; }
  button:hover { border-color:var(--muted); }
  #time { font-variant-numeric:tabular-nums; min-width:110px; }
  #timeline { position:relative; height:44px; background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer; overflow:hidden; touch-action:none; }
  .seg { position:absolute; top:0; bottom:0; border-right:1px solid var(--bg); font-size:11px; padding:3px 4px; color:var(--muted); overflow:hidden; white-space:nowrap; }
  .seg.on { background:#2a2c31; color:var(--text); }
  .mark { position:absolute; top:0; width:2px; height:8px; background:var(--acc); }
  #head { position:absolute; top:0; bottom:0; width:2px; background:var(--acc); pointer-events:none; }
  #shot { min-height:20px; }
  #shot b { color:var(--acc); }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  input[type=text]:focus { outline:none; border-color:var(--acc); }
  #notes { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  #notes li { padding:6px 10px; background:var(--panel); border-radius:6px; cursor:pointer; font-family:ui-monospace,monospace; font-size:13px; overflow-wrap:anywhere; }
  #notes li.done { color:var(--muted); text-decoration:line-through; }
  .keys { font-size:12px; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Anteprima</h1><span class="muted" id="stato"></span></header>
  <div id="err"></div>
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play">Play</button>
    <button id="prev" title="Inquadratura precedente">&#9664;&#9664;</button>
    <button id="next" title="Inquadratura successiva">&#9654;&#9654;</button>
    <span id="time">00:00.0 / 00:00.0</span>
    <span id="shot" class="muted"></span>
  </div>
  <div id="timeline"><div id="head"></div></div>
  <form id="nf">
    <input type="text" id="nt" placeholder="Nota su questo punto (es. zoom troppo veloce, balloon tagliato)" autocomplete="off">
    <button type="submit">Aggiungi nota</button>
  </form>
  <div class="muted keys"><kbd>spazio</kbd> play/pausa · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 1 s · <kbd>,</kbd><kbd>.</kbd> 1 fotogramma · <kbd>[</kbd><kbd>]</kbd> inquadratura · <kbd>N</kbd> scrivi nota (mette in pausa) · la pagina si aggiorna da sola quando cambia la regia</div>
  <ul id="notes"></ul>
</main>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let R = null, IMG = {}, SPR = {}, ver = null, t = 0, playing = false, last = 0;
const audio = new Audio();
audio.preload = 'auto';

const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`;
const load = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

async function fetchRegia(keepT) {
  const d = await (await fetch('/regia.json')).json();
  ver = d.versione;
  if (d.errore) { $('err').style.display = 'block'; $('err').textContent = d.errore; $('stato').textContent = 'regia con errori: correggi il file, la pagina si aggiorna'; return; }
  $('err').style.display = 'none';
  const v = encodeURIComponent(ver);
  const pages = [...new Set(d.inquadrature.filter(s => s.tavola).map(s => s.tavola))];
  const clips = [...new Set(d.inquadrature.filter(s => s.clip).map(s => s.clip))];
  const [pi, ci] = await Promise.all([Promise.all(pages.map(n => load(`/tavola/${n}?v=${v}`))), Promise.all(clips.map(k => load(`/clip/${k}?v=${v}`)))]);
  IMG = {}; SPR = {};
  pages.forEach((n, k) => IMG[n] = pi[k]);
  clips.forEach((k, j) => SPR[k] = ci[j]);
  R = d;
  cv.width = d.w; cv.height = d.h;
  $('title').textContent = d.nome;
  document.title = 'Anteprima ' + d.nome;
  const wasPlaying = playing;
  if (wasPlaying) pause();
  audio.src = `/audio.wav?v=${v}`;
  t = keepT ? Math.min(t, d.totale) : 0;
  buildTimeline();
  $('stato').textContent = `${d.inquadrature.length} inquadrature · ${d.totale.toFixed(1)} s · aggiornata ${new Date().toLocaleTimeString()}`;
  draw();
  if (wasPlaying) play();
}

function indexAt(tt) {
  const S = R.inquadrature;
  for (let i = S.length - 1; i >= 0; i--) if (tt >= S[i].start) return i;
  return 0;
}

// sorgente dell'inquadratura: [immagine, sx, sy, sw, sh, pw, ph]
function source(s, lt) {
  const [x0, y0, x1, y1] = s.box, pw = x1 - x0, ph = y1 - y0;
  if (s.clip && SPR[s.clip]) {
    const n = s.clip_n, k = Math.floor(lt * R.regole.clip_fps) % n, sp = SPR[s.clip], fw = R.sprite_w;
    return [sp, k * fw, 0, fw, sp.height, pw, ph];
  }
  return [IMG[s.tavola], x0, y0, pw, ph, pw, ph];
}

function drawShot(s, lt, alpha) {
  const W = R.w, H = R.h, rule = R.regole;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (s.tipo === 'black' || !IMG[s.tavola]) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore(); return; }
  const [im, sx, sy, sw, sh, pw, ph] = source(s, lt);
  const u = ease(lt / s.dur), z = s.zoom[0] + (s.zoom[1] - s.zoom[0]) * u;
  let fit = Math.min(W * rule.margine[0] / pw, H * rule.margine[1] / ph);
  if (pw / ph > rule.riempi_se_larga) fit = Math.max(W / pw, H / ph);
  const sc = fit * z;
  const [[ax, ay], [bx, by]] = s.pan;
  const fx = (ax + (bx - ax) * u) * pw, fy = (ay + (by - ay) * u) * ph;
  let tx = W / 2 - fx * sc, ty = H / 2 - fy * sc;
  const dw = pw * sc, dh = ph * sc;
  tx = dw > W ? Math.min(0, Math.max(W - dw, tx)) : (W - dw) / 2;
  ty = dh > H ? Math.min(0, Math.max(H - dh, ty)) : (H - dh) / 2;
  if (s.shake && lt < 0.6) { const k = (1 - lt / 0.6) ** 2; tx += (Math.random() * 2 - 1) * s.shake * k; ty += (Math.random() * 2 - 1) * s.shake * k; }
  if (dw < W || dh < H) {  // sfondo: la vignetta stessa sfocata e scura
    ctx.filter = `blur(${rule.sfondo_blur}px) brightness(${rule.sfondo_luce})`;
    ctx.drawImage(im, sx, sy, sw, sh, -40, -40, W + 80, H + 80);
    ctx.filter = 'none';
  }
  ctx.drawImage(im, sx, sy, sw, sh, tx, ty, dw, dh);
  if (s.flash && lt < 0.06) { ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  else if (s.flash && lt < 0.14) { ctx.fillStyle = 'rgba(250,250,250,0.6)'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

function draw() {
  if (!R) return;
  const W = R.w, H = R.h, rule = R.regole, S = R.inquadrature;
  const i = indexAt(t), s = S[i], lt = t - s.start;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (i > 0 && s.entrata === 'dissolvenza' && lt < rule.dissolvenza) {
    const p = S[i - 1];
    drawShot(p, p.dur - 0.01, 1);
    drawShot(s, lt, lt / rule.dissolvenza);
  } else drawShot(s, lt, 1);
  // finitura: tinta fredda, vignettatura, fade
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${rule.tinta.map(c => Math.round(c * 255)).join(',')})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.drawImage(vigLayer(), 0, 0);
  let fade = 0;
  if (t < rule.fade_inizio) fade = 1 - t / rule.fade_inizio;
  if (t > R.totale - rule.fade_fine) fade = Math.max(fade, 1 - (R.totale - t) / rule.fade_fine);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(fade, 1)})`; ctx.fillRect(0, 0, W, H); }
  // interfaccia
  $('time').textContent = `${fmt(t)} / ${fmt(R.totale)}`;
  $('shot').innerHTML = `<b>#${i + 1}</b> ${s.tag} · ${s.dur.toFixed(2)} s${s.clip ? ' · ai:' + s.clip : ''}${s.nota ? ' · ' + escapeHtml(s.nota) : ''}`;
  $('head').style.left = (t / R.totale * 100) + '%';
  document.querySelectorAll('.seg').forEach((e, k) => e.classList.toggle('on', k === i));
}

// vignettatura identica al motore: ellittica, 1 - clip((d - raggio) / morbidezza)^1.5 * forza
let VIG = null;
function vigLayer() {
  const W = R.w, H = R.h, vg = R.regole.vignettatura, key = W + 'x' + H + JSON.stringify(vg);
  if (VIG && VIG.key === key) return VIG.c;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), im = g.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot((x - W / 2) / (W / 2), (y - H / 2) / (H / 2));
    const k = Math.min(Math.max((d - vg.raggio) / vg.morbidezza, 0), 1) ** 1.5 * vg.forza;
    im.data[(y * W + x) * 4 + 3] = Math.round(k * 255);
  }
  g.putImageData(im, 0, 0);
  VIG = { key, c };
  return c;
}

function escapeHtml(x) { return x.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function buildTimeline() {
  const tl = $('timeline');
  tl.querySelectorAll('.seg,.mark').forEach(e => e.remove());
  R.inquadrature.forEach(s => {
    const e = document.createElement('div');
    e.className = 'seg';
    e.style.left = (s.start / R.totale * 100) + '%';
    e.style.width = (s.dur / R.totale * 100) + '%';
    e.textContent = `${s.idx + 1} ${s.tag}`;
    e.title = s.nota || '';
    tl.insertBefore(e, $('head'));
  });
  loadNotes();
}

function seek(x) { t = Math.min(Math.max(x, 0), R.totale - 0.001); if (playing) audio.currentTime = t; draw(); }
function play() { if (!R) return; if (t >= R.totale - 0.01) t = 0; playing = true; $('play').textContent = 'Pausa'; audio.currentTime = t; audio.play().catch(() => {}); last = performance.now(); requestAnimationFrame(tick); }
function pause() { playing = false; $('play').textContent = 'Play'; audio.pause(); }
function tick(now) {
  if (!playing) return;
  // l'audio fa da orologio quando sta suonando; altrimenti il tempo del browser
  if (!audio.paused && audio.readyState >= 2 && Math.abs(audio.currentTime - t) < 1) t = audio.currentTime;
  else t += (now - last) / 1000;
  last = now;
  if (t >= R.totale) { t = R.totale - 0.001; pause(); }
  draw();
  if (playing) requestAnimationFrame(tick);
}
const shotStep = d => { const i = indexAt(t) + d; if (i >= 0 && i < R.inquadrature.length) seek(R.inquadrature[i].start + 0.001); };

$('play').onclick = () => playing ? pause() : play();
$('prev').onclick = () => shotStep(-1);
$('next').onclick = () => shotStep(1);
const tlSeek = e => { const r = $('timeline').getBoundingClientRect(); seek((e.clientX - r.left) / r.width * R.totale); };
$('timeline').addEventListener('pointerdown', e => { tlSeek(e); const mv = ev => tlSeek(ev); window.addEventListener('pointermove', mv); window.addEventListener('pointerup', () => window.removeEventListener('pointermove', mv), { once: true }); });

document.addEventListener('keydown', e => {
  if (!R || e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (k === 'ArrowLeft') seek(t - 1);
  else if (k === 'ArrowRight') seek(t + 1);
  else if (k === ',') { pause(); seek(t - 1 / R.fps); }
  else if (k === '.') { pause(); seek(t + 1 / R.fps); }
  else if (k === '[') shotStep(-1);
  else if (k === ']') shotStep(1);
  else if (k === 'n' || k === 'N') { e.preventDefault(); pause(); $('nt').focus(); }
});

$('nf').onsubmit = async e => {
  e.preventDefault();
  const testo = $('nt').value.trim();
  if (!testo) return;
  const r = await fetch('/note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t, testo }) });
  if (r.ok) { $('nt').value = ''; $('nt').blur(); loadNotes(); }
};

async function loadNotes() {
  const lines = await (await fetch('/note')).json();
  const ul = $('notes'); ul.innerHTML = '';
  const tl = $('timeline'); tl.querySelectorAll('.mark').forEach(e => e.remove());
  lines.forEach(l => {
    const m = l.match(/^- \[( |x)\] (\d+):(\d+(?:\.\d+)?)/);
    const li = document.createElement('li');
    li.textContent = l.replace(/^- \[( |x)\] /, '');
    if (m) {
      const tt = +m[2] * 60 + +m[3];
      if (m[1] === 'x') li.classList.add('done');
      li.onclick = () => { pause(); seek(tt); };
      if (R) { const mk = document.createElement('div'); mk.className = 'mark'; mk.style.left = (tt / R.totale * 100) + '%'; tl.insertBefore(mk, $('head')); }
    }
    ul.appendChild(li);
  });
}

// aggiornamento automatico quando cambiano regia o stile
setInterval(async () => {
  try {
    const v = await (await fetch('/versione')).text();
    if (v !== ver) await fetchRegia(true);
    else loadNotes();
  } catch (e) { $('stato').textContent = 'server non raggiungibile'; }
}, 1500);

fetchRegia(false);
</script>
</body>
</html>
