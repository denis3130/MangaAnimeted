# Death Note, tavole 1-2: vignette (alcune animate con AI) montate sull'audio originale dell'episodio.
# Prima regia scritta per il motore unico; ricalca demo/dn_test.py.
# Uso:  python -m engine info|provini|render regie/deathnote_t01-02.yaml

base: ../demo/dn              # cartella dei materiali (non e' nel repo: vedi .gitignore)
output: demo/output/deathnote_prova_tavole1-2.mp4

tavole:
  1: pages/01.png
  2: pages/02.png

clip_ai:
  f:  ai/f.mp4                # padre che parla
  md: ai/md.mp4               # madre e padre
  lt: ai/lt.mp4               # Light che giura
  ry: ai/ry.mp4               # Ryuk sulle scale

audio:
  sorgente: src/ep05.mp4      # audio originale continuo, niente tagli nella musica
  da: 592.9
  a: 621.7                    # le ultime vignette (~6 s) restano su una coda di silenzio

inquadrature:
  - {tavola: 1, box: [681, 6, 1262, 949],    tag: dialog, dur: 3.3,  clip: f,  zoom: [1.0, 1.06], nota: "padre: No, non ho intenzione..."}
  - {tavola: 1, box: [136, 572, 662, 949],   tag: listen, dur: 1.4,                               nota: "Light ascolta"}
  - {tavola: 1, box: [681, 6, 1262, 949],    tag: dialog, dur: 1.35, clip: f,  zoom: [1.12, 1.16], nota: "padre: ...di fronte al male"}
  - {tavola: 1, box: [136, 120, 662, 523],   tag: dialog, dur: 4.85, clip: md, entrata: dissolvenza, nota: "Ma papa'... Oh, caro..."}
  - {tavola: 1, box: [576, 994, 1258, 1881], tag: dialog, dur: 3.2,            zoom: [1.0, 1.08], nota: "Sono fiero di te, papa'"}
  - {tavola: 1, box: [136, 994, 566, 1777],  tag: listen, dur: 2.6,            zoom: [1.06, 1.0], nota: "E se mai dovesse succederti qualcosa"}
  - {tavola: 2, box: [383, 105, 1167, 945],  tag: tense,  dur: 6.6,  clip: lt,                    nota: "...ti giuro che saro' io stesso..."}
  - {tavola: 2, box: [35, 105, 374, 945],    tag: listen, dur: 2.0,            zoom: [1.0, 1.04], nota: "reazione del padre"}
  - {tavola: 2, box: [34, 975, 1166, 1342],  tag: dialog, dur: 3.9,            zoom: [1.0, 1.06], pan: null, nota: "Light... Light... SLAM"}
  - {tavola: 2, box: [534, 1370, 1290, 1845], tag: dark,  dur: 4.5,  clip: ry, zoom: [1.0, 1.06], entrata: dissolvenza, nota: "Ryuk sulle scale"}
  - {tavola: 2, box: [69, 1369, 528, 1845],  tag: dark,   dur: 4.0,                               nota: "Light nel buio"}
